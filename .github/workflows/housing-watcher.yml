# Runs the housing bot on GitHub's servers, for free.
# Always-on mode: each run keeps checking once a minute for up to 45 minutes, and
# whenever the cron fires, that new run takes over from the old one (~40 s handover).
# Secrets come from Settings -> Secrets and variables -> Actions, never from this file.

name: Housing watcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:           # adds a "Run workflow" button on the Actions tab
    inputs:
      mode:
        description: "What to do"
        type: choice
        default: normal
        options:
          - normal
          - test-telegram
          - check-plaza-login

permissions:
  contents: write              # lets the job save which listings it has already seen

concurrency:
  group: housing-watcher       # one at a time; a new run replaces the old one ("Cancelled" is normal)
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PLAZA_USERNAME: ${{ secrets.PLAZA_USERNAME }}
      PLAZA_PASSWORD: ${{ secrets.PLAZA_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send Telegram test message
        if: ${{ inputs.mode == 'test-telegram' }}
        run: python scraper.py --test

      - name: Test Plaza login (does not apply)
        if: ${{ inputs.mode == 'check-plaza-login' }}
        run: python scraper.py --check-login

      - name: Check listings every minute (and apply)
        if: ${{ !inputs.mode || inputs.mode == 'normal' }}
        run: python scraper.py --loop-minutes 45 --interval 60

      - name: Save seen listings
        if: ${{ always() && (!inputs.mode || inputs.mode == 'normal') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d state ] && git add state/
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Update seen listings"
          git pull --rebase
          git push
